<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <title>Elexify Industries Admin Control Panel</title>
    <base href="/" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <!-- SEO Meta -->
    <meta name="title" content="Elexify Industries Admin Control Panel" />
    <meta
      name="description"
      content="Secure and powerful admin dashboard to manage Elexify Industries's inventory, orders, and website content."
    />

    <link rel="icon" type="image/x-icon" href="assets/favicon.ico" />
    <link
      href="https://fonts.googleapis.com/css2?family=Roboto:wght@300;400;500&display=swap"
      rel="stylesheet"
    />
    <link
      href="https://fonts.googleapis.com/icon?family=Material+Icons"
      rel="stylesheet"
    />
    <script>
      // Applied before Angular loads so there's no flash of the wrong theme.
      (function () {
        var stored = localStorage.getItem('ELEXIFY-THEME');
        var dark =
          stored === 'dark' ||
          (!stored &&
            window.matchMedia('(prefers-color-scheme: dark)').matches);
        if (dark) document.documentElement.classList.add('dark');
      })();
    </script>
  </head>
  <body class="mat-typography">
    <app-root></app-root>
  </body>
</html>
