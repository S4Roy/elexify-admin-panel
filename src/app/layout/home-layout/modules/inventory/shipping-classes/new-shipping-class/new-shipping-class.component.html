<div class="fixed inset-0 overflow-hidden">
  <div class="absolute inset-0 overflow-hidden">
    <div
      class="pointer-events-none fixed inset-y-0 right-0 flex max-w-full pl-10"
    >
      <div class="pointer-events-auto relative w-screen max-w-md">
        <div class="flex h-full flex-col overflow-y-scroll bg-white shadow-xl">
          <h2 class="header" id="slide-over-title">
            {{ data ? "Update" : "New" }} Shipping Class
            <button color="warn" mat-dialog-close mat-icon-button>
              <mat-icon class="text-red-700">close</mat-icon>
            </button>
          </h2>
          <div class="add-wrapper relative my-3 flex-1 px-4 sm:px-6">
            <form class="space-y-1" [formGroup]="formGroup">
              <mat-form-field>
                <mat-label
                  >Name
                  <span
                    class="text-red-500"
                    *ngIf="
                      Global.isInputRuleAvailable(formGroup, 'name', 'required')
                    "
                    >*</span
                  >
                </mat-label>
                <input
                  formControlName="name"
                  matInput
                  [class.is-invalid]="!Global.isInputValid(formGroup, 'name')"
                  placeholder="e.g. Fragile, Heavy, Standard"
                />
                <mat-error
                  *ngIf="
                    !Global.isInputRuleValid(formGroup, 'name', 'required')
                  "
                >
                  This field is required
                </mat-error>
              </mat-form-field>

              <mat-form-field>
                <mat-label
                  >Description
                  <span
                    class="text-red-500"
                    *ngIf="
                      Global.isInputRuleAvailable(
                        formGroup,
                        'description',
                        'required'
                      )
                    "
                    >*</span
                  >
                </mat-label>
                <textarea
                  formControlName="description"
                  matInput
                  [class.is-invalid]="
                    !Global.isInputValid(formGroup, 'description')
                  "
                  placeholder="Type Here"
                ></textarea>
              </mat-form-field>

              <mat-checkbox formControlName="is_default">
                Default class (used when a product doesn't set one)
              </mat-checkbox>

              <mat-form-field>
                <mat-label
                  >Status
                  <span
                    class="text-red-500"
                    *ngIf="
                      Global.isInputRuleAvailable(
                        formGroup,
                        'status',
                        'required'
                      )
                    "
                    >*</span
                  >
                </mat-label>
                <mat-select
                  placeholder="Select"
                  formControlName="status"
                  matInput
                  [class.is-invalid]="!Global.isInputValid(formGroup, 'status')"
                >
                  <mat-option value="active">Active</mat-option>
                  <mat-option value="inactive">Inactive</mat-option>
                </mat-select>
                <mat-error
                  *ngIf="
                    !Global.isInputRuleValid(formGroup, 'status', 'required')
                  "
                >
                  This field is required
                </mat-error>
              </mat-form-field>
            </form>
          </div>
          <div class="p-1">
            <button
              (click)="onSubmit()"
              [disabled]="formGroup.disabled"
              class="btn-primary"
            >
              {{ formGroup.disabled ? "Please wait..." : "Save & Continue" }}
            </button>
          </div>
        </div>
      </div>
    </div>
  </div>
</div>
