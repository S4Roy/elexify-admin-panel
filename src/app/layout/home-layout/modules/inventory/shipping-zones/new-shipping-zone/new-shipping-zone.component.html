<div>
  <form class="space-y-3" [formGroup]="formGroup">
    <div class="space-y-3 bg-white shadow-sm p-3">
      <mat-form-field>
        <mat-label>Name
          <span class="text-red-500" *ngIf="Global.isInputRuleAvailable(formGroup, 'name', 'required')">*</span>
        </mat-label>
        <input formControlName="name" matInput [class.is-invalid]="!Global.isInputValid(formGroup, 'name')"
          placeholder="e.g. North India, International" />
        <mat-error *ngIf="!Global.isInputRuleValid(formGroup, 'name', 'required')">
          This field is required
        </mat-error>
      </mat-form-field>

      <div class="grid grid-cols-1 lg:grid-cols-2 gap-4">
        <div>
          <label>Countries</label>
          <ng-select placeholder="Select Countries" formControlName="countries" [items]="countries"
            bindLabel="name" bindValue="id" [multiple]="true" matInput (scrollToEnd)="loadMoreCountries()"
            (search)="countrySearchSubject.next($event)" [ariaLabel]="'Select Countries'">
          </ng-select>
        </div>

        <div>
          <label>States</label>
          <ng-select placeholder="Select States" formControlName="states" [items]="states" bindLabel="name"
            bindValue="id" [multiple]="true" matInput (scrollToEnd)="loadMoreStates()"
            (search)="stateSearchSubject.next($event)" [ariaLabel]="'Select States'">
            <ng-template ng-option-tmp let-item="item">{{ item.name }} ({{ item.country_name }})</ng-template>
            <ng-template ng-label-tmp let-item="item">{{ item.name }} ({{ item.country_name }})</ng-template>
          </ng-select>
        </div>
      </div>

      <div>
        <div class="flex items-center justify-between">
          <label>Pincode Prefixes</label>
          <button type="button" mat-stroked-button color="primary" (click)="addPrefix()">
            <mat-icon>add</mat-icon> Add Prefix
          </button>
        </div>
        <div formArrayName="pincode_prefixes" class="space-y-2 mt-2">
          <div *ngFor="let prefix of pincode_prefixes.controls; let i = index" class="flex items-center gap-2">
            <mat-form-field class="flex-1">
              <input matInput [formControlName]="i" placeholder="e.g. 11, 12" />
            </mat-form-field>
            <button type="button" mat-icon-button color="warn" (click)="removePrefix(i)" aria-label="Remove prefix">
              <mat-icon>delete</mat-icon>
            </button>
          </div>
          <div *ngIf="!pincode_prefixes.controls.length" class="text-sm text-gray-500">
            No pincode prefixes added — zone matches by country/state only.
          </div>
        </div>
      </div>

      <div class="flex items-center gap-6">
        <mat-checkbox formControlName="is_default">
          Default zone (fallback when nothing else matches an address)
        </mat-checkbox>

        <mat-form-field class="w-48">
          <mat-label>Status
            <span class="text-red-500" *ngIf="
                Global.isInputRuleAvailable(formGroup, 'status', 'required')
              ">*</span>
          </mat-label>
          <mat-select placeholder="Select" formControlName="status" matInput
            [class.is-invalid]="!Global.isInputValid(formGroup, 'status')">
            <mat-option value="active">Active</mat-option>
            <mat-option value="inactive">Inactive</mat-option>
          </mat-select>
          <mat-error *ngIf="!Global.isInputRuleValid(formGroup, 'status', 'required')">
            This field is required
          </mat-error>
        </mat-form-field>
      </div>
    </div>
  </form>
</div>
<div class="flex justify-end space-x-2 m-5">
  <button (click)="location.back()" mat-stroked-button color="accent">
    Back
  </button>
  <button [disabled]="formGroup.disabled" mat-stroked-button color="primary" (click)="onSubmit()">
    {{ formGroup.disabled ? "Please wait..." : "Save & Continue" }}
  </button>
</div>
