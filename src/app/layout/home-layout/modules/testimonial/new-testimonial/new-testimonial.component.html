<div class="fixed inset-0 overflow-hidden">
  <div class="absolute inset-0 overflow-hidden">
    <div
      class="pointer-events-none fixed inset-y-0 right-0 flex max-w-full pl-10"
    >
      <div class="pointer-events-auto relative w-screen max-w-md">
        <div class="flex h-full flex-col overflow-y-scroll bg-white shadow-xl">
          <h2 class="header" id="slide-over-title">
            {{ data ? "Update" : "New" }} Testimonial
            <button color="warn" mat-dialog-close mat-icon-button>
              <mat-icon class="text-red-700">close</mat-icon>
            </button>
          </h2>
          <div class="add-wrapper relative my-3 flex-1 px-4 sm:px-6">
            <form class="space-y-1" [formGroup]="formGroup">
              <mat-form-field>
                <mat-label
                  >Name
                  <span
                    class="text-red-500"
                    *ngIf="
                      Global.isInputRuleAvailable(formGroup, 'name', 'required')
                    "
                    >*</span
                  >
                </mat-label>
                <input
                  formControlName="name"
                  matInput
                  [class.is-invalid]="!Global.isInputValid(formGroup, 'name')"
                  placeholder="Type Here"
                />
                <mat-error
                  *ngIf="
                    !Global.isInputRuleValid(formGroup, 'name', 'required')
                  "
                >
                  This field is required
                </mat-error>
              </mat-form-field>

              <mat-form-field>
                <mat-label
                  >Message
                  <span
                    class="text-red-500"
                    *ngIf="
                      Global.isInputRuleAvailable(
                        formGroup,
                        'message',
                        'required'
                      )
                    "
                    >*</span
                  >
                </mat-label>
                <textarea
                  formControlName="message"
                  matInput
                  [class.is-invalid]="
                    !Global.isInputValid(formGroup, 'message')
                  "
                  placeholder="Type Here"
                ></textarea>
                <mat-error
                  *ngIf="
                    !Global.isInputRuleValid(formGroup, 'message', 'required')
                  "
                >
                  This field is required
                </mat-error>
              </mat-form-field>
              <!-- Rating (optional) -->
              <mat-form-field class="w-full">
                <mat-label>Rating</mat-label>
                <mat-select formControlName="rating">
                  <mat-option *ngFor="let r of [1, 2, 3, 4, 5]" [value]="r">
                    {{ r }} ★
                  </mat-option>
                </mat-select>
              </mat-form-field>

            </form>
          </div>
          <div class="p-1">
            <button
              (click)="onSubmit()"
              [disabled]="formGroup.disabled"
              class="btn-primary"
            >
              {{ formGroup.disabled ? "Please wait..." : "Save & Continue" }}
            </button>
          </div>
        </div>
      </div>
    </div>
  </div>
