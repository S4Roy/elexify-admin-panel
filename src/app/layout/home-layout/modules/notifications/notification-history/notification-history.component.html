<div class="p-4 bg-white shadow-sm rounded-xl mb-4">
  <div class="grid grid-cols-1 sm:grid-cols-3 lg:grid-cols-5 gap-3 items-end">
    <div>
      <label class="block text-xs font-medium text-gray-600 mb-1">Event</label>
      <select [(ngModel)]="filters.event" class="w-full rounded-md border border-gray-300 px-2 py-1.5 text-sm">
        <option value="">All events</option>
        <option *ngFor="let event of eventOptions" [value]="event">{{ event }}</option>
      </select>
    </div>
    <div>
      <label class="block text-xs font-medium text-gray-600 mb-1">Channel</label>
      <select [(ngModel)]="filters.channel" class="w-full rounded-md border border-gray-300 px-2 py-1.5 text-sm">
        <option value="">All channels</option>
        <option *ngFor="let channel of channelOptions" [value]="channel">{{ channel }}</option>
      </select>
    </div>
    <div>
      <label class="block text-xs font-medium text-gray-600 mb-1">Status</label>
      <select [(ngModel)]="filters.status" class="w-full rounded-md border border-gray-300 px-2 py-1.5 text-sm">
        <option value="">All statuses</option>
        <option *ngFor="let status of statusOptions" [value]="status">{{ status }}</option>
      </select>
    </div>
    <div>
      <label class="block text-xs font-medium text-gray-600 mb-1">From</label>
      <input type="date" [(ngModel)]="filters.from" class="w-full rounded-md border border-gray-300 px-2 py-1.5 text-sm" />
    </div>
    <div>
      <label class="block text-xs font-medium text-gray-600 mb-1">To</label>
      <input type="date" [(ngModel)]="filters.to" class="w-full rounded-md border border-gray-300 px-2 py-1.5 text-sm" />
    </div>
  </div>
  <div class="flex gap-2 mt-3">
    <button type="button" (click)="applyFilters()" class="rounded-md bg-primary px-3 py-1.5 text-xs font-semibold text-white hover:opacity-90">
      Apply Filters
    </button>
    <button type="button" (click)="clearFilters()" class="rounded-md border border-gray-300 bg-white px-3 py-1.5 text-xs font-medium text-gray-700 hover:bg-gray-50">
      Clear
    </button>
  </div>
</div>

<div *ngIf="loading" class="text-center text-gray-500 py-6">Loading…</div>

<div *ngIf="!loading" class="table-wrapper">
  <table class="table-base">
    <thead class="text-xs text-gray-700 uppercase bg-gray-50">
      <tr class="sticky">
        <th scope="col">Event</th>
        <th scope="col">Channel</th>
        <th scope="col">Destination</th>
        <th scope="col" class="text-center">Status</th>
        <th scope="col" class="text-center">Attempts</th>
        <th scope="col" class="text-center">Created</th>
        <th scope="col" class="text-center">Sent</th>
      </tr>
    </thead>
    <tbody>
      <ng-container *ngFor="let item of itemList">
        <tr>
          <td class="font-medium text-gray-900 whitespace-nowrap">{{ item?.event }}</td>
          <td class="capitalize">{{ item?.channel }}</td>
          <td>{{ item?.destination_masked }}</td>
          <td class="text-center">
            <span class="table-status" [class]="item?.status">{{ item?.status }}</span>
          </td>
          <td class="text-center">{{ item?.attempts }}</td>
          <td class="text-center">{{ item?.created_at | date : 'short' }}</td>
          <td class="text-center">{{ item?.sent_at ? (item?.sent_at | date : 'short') : '—' }}</td>
        </tr>
      </ng-container>
      <ng-container *ngIf="!itemList?.length">
        <tr>
          <td class="text-center" colspan="7">
            <app-empty-state message="No notification history found"></app-empty-state>
          </td>
        </tr>
      </ng-container>
    </tbody>
  </table>
</div>

<pagination [pagination]="paginationOption" (pageChange)="onPageChange($event)"></pagination>
