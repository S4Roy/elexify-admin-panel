<div class="flex flex-col gap-6">
  <div class="p-6 bg-white shadow-xl rounded-2xl">
    <div class="flex flex-wrap justify-between items-center gap-3 border-b pb-4 mb-4">
      <h3 class="text-lg font-semibold">Notification Summary</h3>
      <div class="inline-flex rounded-md shadow-sm" role="group">
        <button
          *ngFor="let option of rangeOptions"
          type="button"
          (click)="setRange(option.value)"
          class="px-3 py-1.5 text-xs font-semibold border first:rounded-l-md last:rounded-r-md -ml-px first:ml-0"
          [ngClass]="range === option.value
            ? 'bg-primary text-white border-primary'
            : 'bg-white text-gray-700 border-gray-300 hover:bg-gray-50'"
        >
          {{ option.label }}
        </button>
      </div>
    </div>

    <div *ngIf="loading" class="text-center text-gray-500 py-6">Loading…</div>

    <div *ngIf="!loading" class="grid sm:grid-cols-2 gap-8">
      <div>
        <h4 class="text-sm font-semibold text-gray-700 mb-3">By Status</h4>
        <div class="flex flex-col gap-2">
          <div
            *ngFor="let status of statusRows"
            class="flex items-center justify-between text-sm py-1 border-b last:border-0"
          >
            <span class="table-status" [ngClass]="statusClass(status)">{{ status }}</span>
            <span class="font-semibold text-gray-800">{{ countFor(byStatus, status) }}</span>
          </div>
        </div>
      </div>

      <div>
        <h4 class="text-sm font-semibold text-gray-700 mb-3">By Channel</h4>
        <div class="flex flex-col gap-2">
          <div
            *ngFor="let channel of channelRows"
            class="flex items-center justify-between text-sm py-1 border-b last:border-0"
          >
            <span class="capitalize text-gray-700">{{ channel }}</span>
            <span class="font-semibold text-gray-800">{{ countFor(byChannel, channel) }}</span>
          </div>
        </div>
      </div>
    </div>
  </div>

  <div class="p-6 bg-white shadow-xl rounded-2xl">
    <div class="flex items-center justify-between">
      <div>
        <h3 class="text-lg font-semibold">Dead Letter Queue</h3>
        <p class="text-sm text-gray-500">Notifications that exhausted all retry attempts.</p>
      </div>
      <a
        [routerLink]="['/notifications/dead-letter']"
        class="inline-flex items-center rounded-md border border-primary bg-white px-3 py-1.5 text-xs font-semibold text-primary shadow-sm hover:bg-primary/5"
      >
        View Dead Letter Queue
      </a>
    </div>
  </div>
</div>
