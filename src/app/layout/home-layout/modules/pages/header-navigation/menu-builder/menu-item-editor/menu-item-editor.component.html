<h2 mat-dialog-title>{{ isEdit ? "Edit Menu Item" : "Add Menu Item" }}</h2>
<form [formGroup]="formGroup" (ngSubmit)="onSubmit()">
  <div mat-dialog-content class="grid grid-cols-1 sm:grid-cols-2 gap-4">
    <mat-form-field class="w-full sm:col-span-2">
      <mat-label>Type</mat-label>
      <mat-select formControlName="type">
        <mat-option *ngFor="let t of typeOptions" [value]="t.value">{{ t.label }}</mat-option>
      </mat-select>
    </mat-form-field>

    <mat-form-field class="w-full">
      <mat-label>Label</mat-label>
      <input matInput formControlName="label" />
    </mat-form-field>

    <mat-form-field class="w-full">
      <mat-label>Icon</mat-label>
      <input matInput formControlName="icon" />
    </mat-form-field>

    <!-- Reference picker (product / category / blog) -->
    <div *ngIf="needsReference && !needsManualReference" class="w-full sm:col-span-2">
      <label class="text-xs block mb-1" style="color: var(--text-secondary)">Reference</label>
      <ng-select
        [items]="referenceItems"
        [bindLabel]="referenceBindLabel"
        bindValue="_id"
        [searchable]="true"
        formControlName="reference_id"
        placeholder="Search..."
      ></ng-select>
    </div>

    <!-- Manual reference id (internal_page / collection — no list endpoint available) -->
    <mat-form-field *ngIf="needsManualReference" class="w-full sm:col-span-2">
      <mat-label>Reference ID</mat-label>
      <input matInput formControlName="reference_id" placeholder="ObjectId" />
      <mat-hint>No picker available for this type yet — paste the record's ID.</mat-hint>
    </mat-form-field>

    <!-- URL -->
    <mat-form-field *ngIf="needsUrl" class="w-full sm:col-span-2">
      <mat-label>URL</mat-label>
      <input matInput formControlName="custom_url" placeholder="https://... or /path" />
    </mat-form-field>

    <!-- Mega menu content -->
    <div *ngIf="isMegaMenu" class="w-full sm:col-span-2 flex items-center gap-3">
      <button type="button" mat-stroked-button (click)="configureMegaMenu()">
        <mat-icon>view_column</mat-icon> Configure Mega Menu
      </button>
      <span class="text-xs" style="color: var(--text-secondary)">{{ megaMenuSummary }}</span>
    </div>

    <mat-form-field class="w-full">
      <mat-label>Badge text</mat-label>
      <input matInput formControlName="badge_text" placeholder="e.g. New" />
    </mat-form-field>

    <mat-form-field class="w-full">
      <mat-label>Badge color</mat-label>
      <input matInput type="color" formControlName="badge_color" />
    </mat-form-field>

    <mat-form-field class="w-full">
      <mat-label>Target</mat-label>
      <mat-select formControlName="target">
        <mat-option value="_self">Same tab</mat-option>
        <mat-option value="_blank">New tab</mat-option>
      </mat-select>
    </mat-form-field>

    <div class="flex items-center">
      <mat-checkbox formControlName="enabled">Enabled</mat-checkbox>
    </div>

    <mat-form-field class="w-full">
      <mat-label>Schedule start</mat-label>
      <input matInput type="datetime-local" formControlName="schedule_start" />
    </mat-form-field>

    <mat-form-field class="w-full">
      <mat-label>Schedule end</mat-label>
      <input matInput type="datetime-local" formControlName="schedule_end" />
    </mat-form-field>
  </div>

  <div mat-dialog-actions class="flex justify-end gap-2">
    <button type="button" mat-stroked-button (click)="closeDialog()">Cancel</button>
    <button type="submit" mat-flat-button color="primary" [disabled]="formGroup.disabled">
      {{ isEdit ? "Save Changes" : "Add Item" }}
    </button>
  </div>
</form>
