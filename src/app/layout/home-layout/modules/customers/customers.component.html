<div class="table-wrapper">
  <table
    class="w-full text-sm text-left rtl:text-right text-gray-500 dark:text-gray-400"
  >
    <thead class="text-xs text-gray-700 uppercase bg-gray-50">
      <tr class="sticky">
        <th scope="col" (click)="sort('name')" class="sortable">
          Name <span [class]="getSortIcon('name')"></span>
        </th>
        <th scope="col" (click)="sort('email')" class="sortable">
          Email <span [class]="getSortIcon('email')"></span>
        </th>
        <th scope="col" (click)="sort('mobile')" class="sortable">
          Mobile <span [class]="getSortIcon('mobile')"></span>
        </th>
        <th
          scope="col"
          (click)="sort('created_at')"
          class="sortable text-center"
        >
          Date of Registered
          <span [class]="getSortIcon('created_at')"></span>
        </th>
        <th scope="col" (click)="sort('status')" class="sortable text-center">
          Status
          <span [class]="getSortIcon('status')"></span>
        </th>
        <th scope="col" class="text-center">Action</th>
      </tr>
    </thead>
    <tbody>
      <ng-container *ngFor="let item of item_list">
        <tr>
          <td scope="row" class="font-medium text-gray-900 whitespace-nowrap">
            {{ item?.name }}
          </td>

          <td>{{ item?.email }}</td>

          <td>{{ item?.mobile }}</td>
          <td class="text-center">
            {{ item?.created_at | date }}
          </td>
          <td class="text-center">
            <span [class]="item?.status">
              {{ item?.status }}
            </span>
          </td>
          <td class="text-center">
            <app-menu
              [modalItem]="permissions.includes('edidt') ? item : null"
              (initModal)="addItem($event)"
              (deleteItem)="deleteItem($event)"
              [delete]="permissions.includes('deledte') ? item : null"
            ></app-menu>
          </td>
        </tr>
      </ng-container>
      <ng-container *ngIf="!item_list?.length">
        <tr>
          <td class="text-center" colspan="6">No Items Found</td>
        </tr>
      </ng-container>
    </tbody>
  </table>
</div>

<ng-container>
  <pagination
    [pagination]="paginationOption"
    (pageChange)="onPageChange($event)"
  ></pagination>
</ng-container>
