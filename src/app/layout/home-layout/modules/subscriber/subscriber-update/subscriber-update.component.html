<h2 mat-dialog-title>Manage subscription</h2>
<mat-dialog-content><p>{{ data.email }}</p><p>Current status: {{ data.status }}</p><p>Mark this contact as unsubscribed, or suppress it from marketing. A fresh customer opt-in is required to subscribe again.</p>
<mat-form-field appearance="outline"><mat-label>New status</mat-label><mat-select [formControl]="status"><mat-option value="unsubscribed">Unsubscribed</mat-option><mat-option value="suppressed">Suppressed</mat-option></mat-select><mat-error>Select a status</mat-error></mat-form-field>
<p *ngIf="error" role="alert">{{ error }}</p></mat-dialog-content>
<mat-dialog-actions align="end"><button mat-button mat-dialog-close [disabled]="saving">Cancel</button><button mat-flat-button color="primary" [disabled]="saving || status.invalid || !access.can('subscribers.update')" (click)="save()">{{ saving ? 'Saving…' : 'Save changes' }}</button></mat-dialog-actions>
