<div class="table-wrapper">
  <table class="table-base">
    <thead class="">
      <tr class="">
        <th scope="col"></th>
        <th scope="col">Customer</th>
        <th scope="col">Product</th>
        <th scope="col">Reviews</th>
        <th scope="col">Rating</th>
        <th scope="col" class="text-center">Status</th>
        <th class="text-center">Action</th>
      </tr>
    </thead>
    <tbody>
      <ng-container *ngFor="let item of item_list">
        <tr>
          <td>
            <img *ngIf="item?.image?.url" [src]="item?.image?.url" alt="Image" />
          </td>
          <td>{{ item?.user?.name }}</td>
          <td>{{ item?.product?.name }}</td>
          <td>
            <div [innerHTML]="item.description" [appReadMoreClamp]="110" readMoreLabel="Read More"
              readLessLabel="Read Less"></div>
          </td>
          <td>{{ item?.rating }}</td>
          <td class="text-center">
            <button type="button" class="table-status cursor-pointer" [class]="item?.status"
              (click)="updateStatus(item)" [attr.aria-label]="'Change status: ' + item?.status">
              {{ item?.status }}
            </button>
          </td>
          <td class="text-center">
            <app-menu (deleteItem)="deleteItem($event)"
              [delete]="permissions.includes('delete') ? item : null"></app-menu>
          </td>
        </tr>
      </ng-container>
      <ng-container *ngIf="!item_list?.length">
        <tr>
          <td class="text-center" colspan="7"><app-empty-state message="No Items Found"></app-empty-state></td>
        </tr>
      </ng-container>
    </tbody>
  </table>
</div>
<ng-container>
  <pagination [pagination]="paginationOption" (pageChange)="onPageChange($event)"></pagination>
</ng-container>
