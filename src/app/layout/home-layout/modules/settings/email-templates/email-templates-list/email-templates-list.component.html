<div class="flex items-center justify-between mb-4">
  <div class="relative w-full max-w-xs">
    <input
      type="text"
      class="w-full rounded-md border border-gray-300 px-3 py-2 text-sm focus:outline-none focus:ring-1 focus:ring-primary"
      placeholder="Search by action or subject..."
      [value]="searchTerm"
      (input)="onSearchChange($any($event.target).value)"
    />
  </div>
</div>

<div class="table-wrapper">
  <table class="table-base">
    <thead class="text-xs text-gray-700 uppercase bg-gray-50">
      <tr class="sticky">
        <th scope="col">Action</th>
        <th scope="col">Subject</th>
        <th scope="col" class="text-center">Status</th>
        <th scope="col" class="text-center">Marketing</th>
        <th scope="col" class="text-center">Version</th>
        <th scope="col" class="text-center">Updated</th>
        <th scope="col" class="text-center">Action</th>
      </tr>
    </thead>
    <tbody>
      <ng-container *ngFor="let item of templateList">
        <tr class="cursor-pointer" (click)="editTemplate(item?.action)">
          <td scope="row" class="font-medium text-gray-900 whitespace-nowrap">
            {{ item?.action }}
          </td>
          <td>{{ item?.subject }}</td>
          <td class="text-center">
            <span class="table-status" [class]="item?.status">{{ item?.status }}</span>
          </td>
          <td class="text-center">{{ item?.is_marketing ? 'Yes' : 'No' }}</td>
          <td class="text-center">{{ item?.template_version }}</td>
          <td class="text-center">{{ item?.updated_at | date: 'medium' }}</td>
          <td class="text-center">
            <button
              type="button"
              class="text-primary text-sm font-medium hover:underline"
              (click)="$event.stopPropagation(); editTemplate(item?.action)"
            >
              {{ isPrivileged ? 'Edit' : 'View' }}
            </button>
          </td>
        </tr>
      </ng-container>
      <ng-container *ngIf="!loading && !templateList?.length">
        <tr>
          <td class="text-center" colspan="7">
            <app-empty-state message="No email templates found"></app-empty-state>
          </td>
        </tr>
      </ng-container>
    </tbody>
  </table>
</div>
