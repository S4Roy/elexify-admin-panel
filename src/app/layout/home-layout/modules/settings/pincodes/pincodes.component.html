<div class="table-wrapper">
  <table class="table-base">
    <thead class="text-xs text-gray-700 uppercase bg-gray-50">
      <tr class="sticky">
        <th scope="col" (click)="sort('pincode')" class="sortable">
          Pincode <span [class]="getSortIcon('pincode')"></span>
        </th>
        <th scope="col" (click)="sort('district')" class="sortable">
          District <span [class]="getSortIcon('district')"></span>
        </th>
        <th scope="col">City</th>
        <th scope="col">State</th>
        <th scope="col">Note</th>
        <th scope="col" class="text-center">COD</th>
        <th
          scope="col"
          (click)="sort('updated_at')"
          class="sortable text-center"
        >
          Last Updated
          <span [class]="getSortIcon('updated_at')"></span>
        </th>
        <th scope="col" (click)="sort('status')" class="sortable text-center">
          Serviceable
          <span [class]="getSortIcon('status')"></span>
        </th>
      </tr>
    </thead>
    <tbody>
      <ng-container *ngFor="let item of item_list">
        <tr>
          <td scope="row" class="font-medium text-gray-900 whitespace-nowrap">
            {{ item?.pincode }}
          </td>
          <td scope="row" class="font-medium text-gray-900 whitespace-nowrap">
            {{ item?.district }}
          </td>
          <td>{{ item?.city?.name || '—' }}</td>
          <td>{{ item?.state?.name || '—' }}</td>
          <td>{{ item?.note || '—' }}</td>
          <td class="text-center">
            <button type="button" class="cursor-pointer" (click)="updateCodStatus(item)" [attr.aria-label]="'Change COD setting: ' + (item?.cod_status || 'use_global')">
              {{ item?.cod_status === 'allowed' ? 'allowed' : item?.cod_status === 'disallowed' ? 'blocked' : 'global' }}
            </button>
          </td>
          <td class="text-center">
            {{ item?.updated_at | date }}
          </td>
          <td class="text-center">
            <button
              type="button"
              class="cursor-pointer"
              [class]="item?.status"
              (click)="updatePincodeStatus(item)"
              [attr.aria-label]="'Change status: ' + item?.status"
            >
              {{ item?.status === 'active' ? 'active' : 'excluded' }}
            </button>
          </td>
        </tr>
      </ng-container>
      <ng-container *ngIf="!item_list?.length">
        <tr>
          <td class="text-center" colspan="8"><app-empty-state message="No Items Found"></app-empty-state></td>
        </tr>
      </ng-container>
    </tbody>
  </table>
</div>

<ng-container>
  <pagination
    [pagination]="paginationOption"
    (pageChange)="onPageChange($event)"
  ></pagination>
</ng-container>
