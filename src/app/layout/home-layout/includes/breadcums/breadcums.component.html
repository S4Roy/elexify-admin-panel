<div
  class="flex flex-wrap items-center gap-2 px-3 py-2 mt-2 mb-0 system-bg text-sm sm:text-base"
  *ngIf="breadcrumbs?.length"
>
  <!-- Optional OTHERS section -->
  <ng-container *ngIf="settingsOutlet || usersOutlet">
    <a
      class="font-medium flex items-center text-gray-700 hover:text-teal-600 transition"
      [routerLink]=""
    >
      OTHERS
      <img
        src="assets/double-arrow.png"
        alt="arrow"
        class="mx-1 inline-block size-4 sm:size-5"
      />
    </a>
  </ng-container>

  <!-- Breadcrumb items -->
  <ng-container *ngFor="let item of breadcrumbs; let l = last">
    <a
      class="font-medium flex items-center text-gray-700 bread-crumb transition"
      [routerLink]="[item?.url]"
      [routerLinkActiveOptions]="{ exact: true }"
      routerLinkActive="bread-crumb-active"
    >
      {{ item?.label | uppercase }}
      <img
        src="assets/double-arrow.png"
        *ngIf="!l"
        alt="arrow"
        class="mx-1 inline-block size-4 sm:size-5"
      />
    </a>
  </ng-container>
</div>
