<div class="pagination-container">
  <div class="pagination-info" role="status" aria-live="polite">
    <span class="record-range">{{ rangeStart | number }}–{{ rangeEnd | number }}</span>
    <span>of <b>{{ (pagination.totalDocs || 0) | number }}</b> records</span>
  </div>

  <div class="pagination-actions">
    <label class="page-size-control" matTooltip="Rows per page">
      <span>Rows</span>
      <select aria-label="Rows per page" [ngModel]="pageSize"
        [ngModelOptions]="{ standalone: true }" (ngModelChange)="selectPageSize($event)">
        <option *ngFor="let size of availablePageSizes" [ngValue]="size">{{ size }}</option>
      </select>
      <mat-icon aria-hidden="true">expand_more</mat-icon>
    </label>

    <div class="pagination-controls" *ngIf="pagination.totalDocs > pagination.limit">
      <button type="button" class="page-btn direction-btn" matTooltip="Previous Page"
        aria-label="Previous Page" [disabled]="value === 1" (click)="selectPage(value - 1)">
        <mat-icon>chevron_left</mat-icon>
      </button>
      <div class="page-numbers" *ngIf="device.isDesktop()">
        <ng-container *ngFor="let page of visiblePages">
          <span class="page-ellipsis" *ngIf="page === '…'">…</span>
          <button *ngIf="page !== '…'" type="button" class="page-btn page-number"
            [class.active]="value === page" [attr.aria-current]="value === page ? 'page' : null"
            [attr.aria-label]="'Page ' + page" [disabled]="value === page" (click)="selectPage($any(page))">
            {{ page }}
          </button>
        </ng-container>
      </div>
      <span class="page-count" *ngIf="!device.isDesktop()">{{ value }} <span>/ {{ pagination.totalPages | number }}</span></span>
      <button type="button" class="page-btn direction-btn" matTooltip="Next Page"
        aria-label="Next Page" [disabled]="value === pagination.totalPages" (click)="selectPage(value + 1)">
        <mat-icon>chevron_right</mat-icon>
      </button>
    </div>

    <details class="page-jump-menu" *ngIf="pagination.totalDocs > pagination.limit" #jumpMenu>
      <summary aria-label="Jump to a page" matTooltip="Jump to page"><mat-icon>more_horiz</mat-icon></summary>
      <div class="page-jump-panel">
        <label class="page-jump">
          <span>Go to page <span class="page-total">(1–{{ pagination.totalPages | number }})</span></span>
          <input #pageInput type="text" inputmode="numeric" autocomplete="off" [value]="value"
            aria-label="Page number" [attr.aria-invalid]="pageError ? true : null"
            (input)="pageError = ''"
            (keydown.enter)="$event.preventDefault(); submitPageJump(pageInput)"
            (keydown.escape)="pageInput.value = value.toString(); pageError = ''; jumpMenu.open = false" />
          <span class="page-error" *ngIf="pageError" role="alert">{{ pageError }}</span>
        </label>
        <button type="button" class="jump-submit" (click)="submitPageJump(pageInput)">Go <mat-icon>arrow_forward</mat-icon></button>
      </div>
    </details>
  </div>
</div>
