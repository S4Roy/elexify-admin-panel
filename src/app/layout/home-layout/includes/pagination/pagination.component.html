<div class="pagination-container">
  <!-- Info Display — desktop only. On mobile the "Page X of Y" text was
       redundant with the prev/next controls right below it and just ate
       vertical space, so it's dropped rather than shown. -->
  <div class="pagination-info" *ngIf="device.isDesktop()">
    Showing
    <b>{{ (pagination.page - 1) * pagination.limit + 1 }}</b>
    –
    <b>{{
      pagination.page === pagination.totalPages
        ? pagination.totalDocs
        : pagination.page * pagination.limit
    }}</b>
    of <b>{{ pagination.totalDocs }}</b> records
  </div>

  <!-- Pagination Controls -->
  <div class="pagination-controls" *ngIf="pagination.totalDocs > 10">
    <button
      class="page-btn"
      matTooltip="First Page"
      [disabled]="value === 1"
      (click)="selectPage(1)"
    >
      <mat-icon>first_page</mat-icon>
    </button>

    <button
      class="page-btn"
      matTooltip="Previous Page"
      [disabled]="value === 1"
      (click)="selectPage(value - 1)"
    >
      <mat-icon>chevron_left</mat-icon>
    </button>

    <!-- Only show page numbers on desktop -->
    <ng-container *ngIf="device.isDesktop()">
      <ng-container *ngFor="let page of pageItems">
        <span *ngIf="page === ELLIPSIS" class="page-ellipsis">{{
          ELLIPSIS
        }}</span>
        <button
          *ngIf="page !== ELLIPSIS"
          class="page-btn page-number"
          [class.active]="value === page"
          [disabled]="value === page"
          (click)="selectPage($any(page))"
        >
          {{ page }}
        </button>
      </ng-container>
    </ng-container>

    <button
      class="page-btn"
      matTooltip="Next Page"
      [disabled]="value === pagination.totalPages"
      (click)="selectPage(value + 1)"
    >
      <mat-icon>chevron_right</mat-icon>
    </button>

    <button
      class="page-btn"
      matTooltip="Last Page"
      [disabled]="value === pagination.totalPages"
      (click)="selectPage(pagination.totalPages)"
    >
      <mat-icon>last_page</mat-icon>
    </button>
  </div>
</div>
