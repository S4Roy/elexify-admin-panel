<button type="button" class="dialog-btn-close" aria-label="Close" (click)="closeModal()"></button>
<mat-dialog-content>
  <div class="relative transform overflow-hidden rounded-lg bg-white text-left shadow-xl transition-all sm:my-8 sm:w-full sm:max-w-lg">
    <div class="bg-white px-4 pb-4 pt-5 sm:p-6 sm:pb-4">
      <div class="sm:flex sm:items-start">
        <div class="mx-auto flex size-12 shrink-0 items-center justify-center rounded-full bg-blue-100 sm:mx-0 sm:size-10">
          <svg class="size-6 text-blue-600" fill="none" viewBox="0 0 24 24" stroke-width="1.5" stroke="currentColor" aria-hidden="true">
            <path stroke-linecap="round" stroke-linejoin="round"
              d="M21.75 6.75v10.5a2.25 2.25 0 0 1-2.25 2.25h-15a2.25 2.25 0 0 1-2.25-2.25V6.75m19.5 0A2.25 2.25 0 0 0 19.5 4.5h-15a2.25 2.25 0 0 0-2.25 2.25m19.5 0v.243a2.25 2.25 0 0 1-1.07 1.916l-7.5 4.615a2.25 2.25 0 0 1-2.36 0L3.32 8.91a2.25 2.25 0 0 1-1.07-1.916V6.75" />
          </svg>
        </div>
        <div class="mt-3 w-full sm:ml-4 sm:mt-0 sm:text-left">
          <h3 class="text-base font-semibold text-gray-900" id="modal-title">
            {{ data?.title ?? 'Send Test Email' }}
          </h3>
          <div class="mt-2">
            <p class="text-sm text-gray-500">
              {{ data?.message ?? 'This sends a real email using safe fixture data. Enter the address to receive it.' }}
            </p>
          </div>

          <form [formGroup]="formGroup" class="mt-4">
            <mat-form-field class="w-full" appearance="outline">
              <mat-label>Email Address</mat-label>
              <input matInput type="email" formControlName="email" placeholder="you@example.com" />
              <mat-error *ngIf="formGroup.get('email')?.hasError('required')">
                Email is required
              </mat-error>
              <mat-error *ngIf="formGroup.get('email')?.hasError('email')">
                Enter a valid email address
              </mat-error>
            </mat-form-field>
          </form>
        </div>
      </div>
    </div>
    <div class="bg-gray-50 px-4 py-3 sm:flex sm:flex-row-reverse sm:px-6">
      <button (click)="onConfirm()" type="button"
        class="inline-flex w-full justify-center rounded-md border border-blue-300 bg-white px-3 py-2 text-sm font-semibold text-blue-700 shadow-sm hover:bg-blue-50 sm:ml-3 sm:w-auto">
        Send Test
      </button>
      <button (click)="onCancel()" type="button"
        class="mt-3 inline-flex w-full justify-center rounded-md bg-primary px-3 py-2 text-sm font-semibold text-white shadow-sm hover:opacity-90 sm:mt-0 sm:w-auto">
        Cancel
      </button>
    </div>
  </div>
</mat-dialog-content>
