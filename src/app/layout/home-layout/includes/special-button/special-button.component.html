<ng-container *ngIf="askForPrice">
  <span
    class="inline-flex m-1 items-center gap-2 px-2 py-1 rounded-md text-xs font-medium bg-yellow-100 text-yellow-800"
  >
    <span class="truncate max-w-[10rem] flex items-center gap-1"
      >Ask for Price
      <svg
        class="w-3 h-3"
        viewBox="0 0 20 20"
        fill="currentColor"
        aria-hidden="true"
      >
        <path
          d="M2.003 5.884L10 9.882l7.997-3.998A2 2 0 0016 4H4a2 2 0 00-1.997 1.884z"
        />
        <path d="M18 8.118l-8 4-8-4V14a2 2 0 002 2h12a2 2 0 002-2V8.118z" />
      </svg>
    </span>
  </span>
</ng-container>
<ng-container *ngIf="enableEnquiry">
  <span
    class="inline-flex m-1 items-center gap-2 px-2 py-1 rounded-md text-xs font-medium bg-blue-100 text-blue-800"
  >
    <span class="truncate max-w-[10rem] flex items-center gap-1"
      >Send Enquiry
      <svg
        class="w-3 h-3"
        viewBox="0 0 20 20"
        fill="currentColor"
        aria-hidden="true"
      >
        <path
          d="M2.003 5.884L10 9.882l7.997-3.998A2 2 0 0016 4H4a2 2 0 00-1.997 1.884z"
        />
        <path d="M18 8.118l-8 4-8-4V14a2 2 0 002 2h12a2 2 0 002-2V8.118z" />
      </svg>
    </span>
  </span>
</ng-container>
