<button type="button" class="dialog-btn-close" aria-label="Close" (click)="onCancel()"></button>
<mat-dialog-content>
  <div class="relative transform overflow-hidden rounded-lg bg-white text-left shadow-xl transition-all sm:my-8 sm:w-full sm:max-w-lg">
    <div class="bg-white px-4 pb-4 pt-5 sm:p-6 sm:pb-4">
      <h3 class="text-base font-semibold text-gray-900">
        Run "{{ data.operation?.name }}"
      </h3>

      <div class="mt-3 space-y-2 text-sm">
        <div class="flex items-center gap-2">
          <span class="text-gray-500">Environment:</span>
          <span
            class="rounded-full px-2 py-0.5 text-xs font-semibold"
            [class.bg-red-100]="isProduction"
            [class.text-red-700]="isProduction"
            [class.bg-gray-100]="!isProduction"
            [class.text-gray-700]="!isProduction"
          >
            {{ data.environment }}
          </span>
        </div>
        <div class="flex items-center gap-2">
          <span class="text-gray-500">Version:</span>
          <span class="text-gray-900">{{ data.operation?.version ?? '—' }}</span>
        </div>
        <div class="flex items-center gap-2">
          <span class="text-gray-500">Risk:</span>
          <span class="text-gray-900">{{ data.operation?.risk }}</span>
        </div>
      </div>

      <div class="mt-4 rounded-md bg-gray-50 border border-gray-200 px-3 py-2 text-sm text-gray-700">
        {{ impactText }}
      </div>

      <div *ngIf="requiresTypedConfirmation" class="mt-4">
        <label class="block text-sm text-gray-700 mb-1">
          This is a {{ data.operation?.risk }}-risk operation targeting production. Type
          <strong>{{ requiredPhrase }}</strong> to enable Run.
        </label>
        <input
          type="text"
          [(ngModel)]="typedConfirmation"
          name="confirmation"
          class="w-full rounded-md border border-gray-300 px-3 py-2 text-sm"
          [placeholder]="requiredPhrase"
          autocomplete="off"
        />
      </div>
    </div>

    <div class="bg-gray-50 px-4 py-3 sm:flex sm:flex-row-reverse sm:px-6 gap-3">
      <button
        (click)="onRun()"
        [disabled]="!canRun"
        type="button"
        class="inline-flex w-full justify-center rounded-md bg-red-600 px-3 py-2 text-sm font-semibold text-white shadow-sm hover:bg-red-500 disabled:opacity-50 disabled:cursor-not-allowed sm:w-auto"
      >
        Run
      </button>
      <button
        (click)="onCancel()"
        type="button"
        class="mt-3 inline-flex w-full justify-center rounded-md bg-white px-3 py-2 text-sm font-semibold text-gray-900 shadow-sm ring-1 ring-inset ring-gray-300 hover:bg-gray-50 sm:mt-0 sm:w-auto"
      >
        Cancel
      </button>
    </div>
  </div>
</mat-dialog-content>
