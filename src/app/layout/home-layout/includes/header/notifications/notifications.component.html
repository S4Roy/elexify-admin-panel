<div class="fixed inset-0 overflow-hidden">
  <div class="absolute inset-0 overflow-hidden">
    <div
      class="pointer-events-none fixed inset-y-0 right-0 flex max-w-full pl-10"
    >
      <div class="pointer-events-auto relative w-screen max-w-md">
        <div class="flex h-full flex-col overflow-y-scroll bg-white shadow-xl">
          <div class="p-1 add-new-title sm:px-6">
            <h2
              class="flex mb-0 justify-between items-center font-semibold text-white"
              id="slide-over-title"
            >
              <span>
                Notifications
                <a
                  *ngIf="total_unread_record"
                  (click)="notificationMarkAllAsRead()"
                  class="mx-1 cursor-pointer text-xs text-red-500 uppercase"
                  >Mark All as Read</a
                ></span
              >
              <button color="warn" (click)="close()" mat-icon-button>
                <mat-icon class="text-red-700">close</mat-icon>
              </button>
            </h2>
          </div>
          <div
            style="height: calc(100vh - 250px); overflow-y: auto"
            class="relative my-3 flex-1 px-4 sm:px-6"
          >
            <ng-container *ngFor="let item of item_list">
              <div
                [class]="
                  item?.is_read === 'y'
                    ? ' text-gray-800 rounded-lg bg-gray-100'
                    : ' text-blue-800 rounded-lg bg-blue-50'
                "
                class="flex p-4 mb-4 text-sm rounded-lg"
                role="alert"
              >
                <svg
                  class="shrink-0 inline w-4 h-4 me-3 mt-[2px]"
                  aria-hidden="true"
                  xmlns="http://www.w3.org/2000/svg"
                  fill="currentColor"
                  viewBox="0 0 20 20"
                >
                  <path
                    d="M10 .5a9.5 9.5 0 1 0 9.5 9.5A9.51 9.51 0 0 0 10 .5ZM9.5 4a1.5 1.5 0 1 1 0 3 1.5 1.5 0 0 1 0-3ZM12 15H8a1 1 0 0 1 0-2h1v-3H8a1 1 0 0 1 0-2h2a1 1 0 0 1 1 1v4h1a1 1 0 0 1 0 2Z"
                  />
                </svg>
                <span class="sr-only">Info</span>
                <div>
                  <span class="font-medium">{{ item?.title }}</span>
                  <ul class="mt-1.5 list-disc list-inside">
                    <ng-container
                      *ngFor="let content of parseJson(item?.content)"
                    >
                      <li>{{ content?.item_description }}</li>
                      <!-- <li>{{content?.item?.message}}</li> -->
                    </ng-container>
                  </ul>
                </div>
                <button
                  *ngIf="item?.is_read === 'n'"
                  matTooltip="Mark as Read"
                  (click)="notificationMarkAsRead(item)"
                  type="button"
                  class="ms-auto -mx-1.5 -my-1.5 bg-blue-50 text-blue-500 rounded-lg focus:ring-2 focus:ring-blue-400 p-1.5 hover:bg-blue-200 inline-flex items-center justify-center h-8 w-8"
                  data-dismiss-target="#alert-1"
                  aria-label="Close"
                >
                  <span class="sr-only">Close</span>
                  <mat-icon aria-hidden="true" class="w-3 h-3">check</mat-icon>
                </button>
              </div>
            </ng-container>
            <p *ngIf="!item_list?.length">No Items Found</p>
            <div class="fixed bg-white bottom-0">
              <pagination
                [pagination]="paginationOption"
                (pageChange)="onPageChange($event)"
              ></pagination>
            </div>
          </div>
        </div>
      </div>
    </div>
  </div>
</div>
