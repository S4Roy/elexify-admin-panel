<div class="fixed inset-0 overflow-hidden">
  <div class="absolute inset-0 overflow-hidden">
    <div
      class="pointer-events-none fixed inset-y-0 right-0 flex max-w-full pl-10"
    >
      <div class="pointer-events-auto relative w-screen max-w-md">
        <div class="flex h-full flex-col overflow-y-scroll bg-white shadow-xl">
          <div class="p-1 add-new-title sm:px-6">
            <h2
              class="flex mb-0 justify-between items-center font-semibold text-white"
              id="slide-over-title"
            >
              Change Password
              <button color="warn" mat-dialog-close mat-icon-button>
                <mat-icon class="text-red-700">close</mat-icon>
              </button>
            </h2>
          </div>
          <div class="relative my-3 flex-1 px-4 sm:px-6">
            <form class="space-y-1" [formGroup]="formGroup">
              <div>
                <label class="block text-sm/6 font-medium text-gray-900"
                  >Old Password
                  <span
                    class="text-red-500"
                    *ngIf="
                      Global.isInputRuleAvailable(
                        formGroup,
                        'old_password ',
                        'required'
                      )
                    "
                    >*</span
                  >
                </label>
                <div class="mt-2">
                  <mat-form-field>
                    <input
                      [type]="visibiltyToogle[1] ? 'text' : 'password'"
                      formControlName="old_password"
                      matInput
                      [class.is-invalid]="
                        !Global.isInputValid(formGroup, 'old_password')
                      "
                      placeholder="Type Here"
                    />
                    <mat-icon
                      (click)="visibiltyToogle[1] = !visibiltyToogle[1]"
                      matSuffix
                      >{{
                        !visibiltyToogle[1] ? "visibility_off" : "visibility"
                      }}</mat-icon
                    >
                    <mat-error
                      *ngIf="
                        !Global.isInputRuleValid(
                          formGroup,
                          'old_password',
                          'required'
                        )
                      "
                    >
                      This field is required
                    </mat-error>
                  </mat-form-field>
                </div>
              </div>
              <div>
                <label class="block text-sm/6 font-medium text-gray-900"
                  >New Password
                  <span
                    class="text-red-500"
                    *ngIf="
                      Global.isInputRuleAvailable(
                        formGroup,
                        'new_password',
                        'required'
                      )
                    "
                    >*</span
                  >
                </label>
                <div class="mt-2">
                  <mat-form-field>
                    <input
                      [type]="visibiltyToogle[2] ? 'text' : 'password'"
                      formControlName="new_password"
                      matInput
                      [class.is-invalid]="
                        !Global.isInputValid(formGroup, 'new_password')
                      "
                      placeholder="Type Here"
                    />
                    <mat-icon
                      (click)="visibiltyToogle[2] = !visibiltyToogle[2]"
                      matSuffix
                      >{{
                        !visibiltyToogle[2] ? "visibility_off" : "visibility"
                      }}</mat-icon
                    >
                    <mat-error
                      *ngIf="
                        !Global.isInputRuleValid(
                          formGroup,
                          'new_password',
                          'required'
                        )
                      "
                    >
                      This field is required
                    </mat-error>
                  </mat-form-field>
                </div>
              </div>
              <div>
                <label class="block text-sm/6 font-medium text-gray-900"
                  >Confirm New Password
                  <span
                    class="text-red-500"
                    *ngIf="
                      Global.isInputRuleAvailable(
                        formGroup,
                        'confirm_password',
                        'required'
                      )
                    "
                    >*</span
                  >
                </label>
                <div class="mt-2">
                  <mat-form-field>
                    <input
                      [type]="visibiltyToogle[3] ? 'text' : 'password'"
                      formControlName="confirm_password"
                      matInput
                      [class.is-invalid]="
                        !Global.isInputValid(formGroup, 'confirm_password')
                      "
                      placeholder="Type Here"
                    />
                    <mat-icon
                      (click)="visibiltyToogle[3] = !visibiltyToogle[3]"
                      matSuffix
                      >{{
                        !visibiltyToogle[3] ? "visibility_off" : "visibility"
                      }}</mat-icon
                    >
                    <mat-error
                      *ngIf="
                        !Global.isInputRuleValid(
                          formGroup,
                          'confirm_password',
                          'required'
                        )
                      "
                    >
                      This field is required
                    </mat-error>
                  </mat-form-field>
                </div>
              </div>
            </form>
          </div>
          <button
            (click)="onSubmit()"
            [disabled]="formGroup.disabled"
            class="save-button"
          >
            {{ formGroup.disabled ? "Please wait..." : "Save & Continue" }}
          </button>
        </div>
      </div>
    </div>
  </div>
</div>
