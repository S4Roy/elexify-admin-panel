<div class="flex min-h-full flex-col justify-center px-6 py-12 lg:px-8">
  <div class="sm:mx-auto sm:w-full sm:max-w-sm">
    <img class="mx-auto h-10 w-auto" src="assets/logo.png" alt="Logo" />
    <h2
      class="mt-10 text-center text-2xl/9 font-bold tracking-tight text-gray-900"
    >
      Reset Password
    </h2>
  </div>

  <div class="mt-10 sm:mx-auto sm:w-full sm:max-w-sm">
    <form class="space-y-1" [formGroup]="formGroup">
      <div>
        <label class="block text-sm/6 font-medium text-gray-900"
          >New Password
          <span
            class="text-red-500"
            *ngIf="
              Global.isInputRuleAvailable(formGroup, 'new_password', 'required')
            "
            >*</span
          ></label
        >
        <div class="mt-2">
          <mat-form-field>
            <input
              [type]="visibiltyToogle[0] ? 'text' : 'password'"
              formControlName="new_password"
              matInput
              [class.is-invalid]="!Global.isInputValid(formGroup, 'new_password')"
              placeholder="Type Here"
            />
            <button
              type="button"
              mat-icon-button
              matSuffix
              (click)="visibiltyToogle[0] = !visibiltyToogle[0]"
              [attr.aria-label]="visibiltyToogle[0] ? 'Hide password' : 'Show password'"
            >
              <mat-icon>{{
                !visibiltyToogle[0] ? "visibility_off" : "visibility"
              }}</mat-icon>
            </button>
            <mat-error
              *ngIf="
                !Global.isInputRuleValid(formGroup, 'new_password', 'required')
              "
            >
              This field is required
            </mat-error>
            <mat-error
              *ngIf="
                !Global.isInputRuleValid(formGroup, 'new_password', 'minlength')
              "
            >
              Password must be at least 8 characters
            </mat-error>
          </mat-form-field>
        </div>
      </div>

      <div>
        <label class="block text-sm/6 font-medium text-gray-900"
          >Confirm New Password
          <span
            class="text-red-500"
            *ngIf="
              Global.isInputRuleAvailable(
                formGroup,
                'confirm_new_password',
                'required'
              )
            "
            >*</span
          ></label
        >
        <div class="mt-2">
          <mat-form-field>
            <input
              [type]="visibiltyToogle[1] ? 'text' : 'password'"
              formControlName="confirm_new_password"
              matInput
              [class.is-invalid]="
                !Global.isInputValid(formGroup, 'confirm_new_password')
              "
              placeholder="Type Here"
            />
            <button
              type="button"
              mat-icon-button
              matSuffix
              (click)="visibiltyToogle[1] = !visibiltyToogle[1]"
              [attr.aria-label]="visibiltyToogle[1] ? 'Hide password' : 'Show password'"
            >
              <mat-icon>{{
                !visibiltyToogle[1] ? "visibility_off" : "visibility"
              }}</mat-icon>
            </button>
            <mat-error
              *ngIf="
                !Global.isInputRuleValid(
                  formGroup,
                  'confirm_new_password',
                  'required'
                )
              "
            >
              This field is required
            </mat-error>
            <mat-error
              *ngIf="
                !Global.isInputRuleValid(
                  formGroup,
                  'confirm_new_password',
                  'mustMatch'
                )
              "
            >
              Passwords do not match
            </mat-error>
          </mat-form-field>
        </div>
      </div>

      <div class="text-sm text-right" style="margin-bottom: 10px">
        <a routerLink="/auth/login" class="text-primary">Sign In?</a>
      </div>
      <div>
        <button
          (click)="onSubmit()"
          [disabled]="formGroup.disabled"
          class="btn-primary"
        >
          {{ formGroup.disabled ? "Please wait..." : "Reset Password" }}
        </button>
      </div>
    </form>
  </div>
</div>
