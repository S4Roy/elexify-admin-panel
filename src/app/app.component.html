<router-outlet></router-outlet>
<ngx-spinner
  class="brand-spinner"
  [bdColor]="themeService.isDark() ? 'rgba(7, 12, 22, 0.72)' : 'rgba(255, 255, 255, 0.68)'"
  type="ball-scale-multiple"
>
  <div class="brand-loader" role="status" aria-live="polite" aria-label="Loading Elexify">
    <img class="brand-loader__animation" src="assets/elexify-loader.gif" alt="" width="112" height="112" />
    <span class="brand-loader__label">Loading</span>
  </div>
</ngx-spinner>
